<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1418;
      --card-bg:     #1a1f25;
      --card-bg-2:   #232831;
      --text:        #e8e3de;
      --muted:       #8a8a8a;
      --border:      #2a3038;
      --accent:      #4a90d9;
      --red:         #e74c5e;
      --orange:      #f5a623;
      --green:       #5cb85c;
      --purple:      #8b5cf6;
      --blue:        #4a90d9;
      --pink:        #ec4899;
      --teal:        #14b8a6;
      --font:        'Nunito', -apple-system, system-ui, sans-serif;
      --radius:      16px;
      --shadow:      0 2px 12px rgba(0,0,0,0.4);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ── Top header bar ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--accent); }
    .header-date {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── Google Sign-In button ── */
    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 24px;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    .google-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(74,144,217,0.15);
    }
    .google-btn svg { width: 18px; height: 18px; }
    .google-btn.signed-in {
      border-color: var(--green);
      background: rgba(92, 184, 92, 0.15);
      color: var(--green);
    }

    /* ── Main layout ── */
    .main {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      gap: 0;
      height: calc(100vh - 60px);
    }

    /* ── Left sidebar ── */
    .sidebar {
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Cards (sidebar widgets) ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .sidebar .card {
      border: none;
      box-shadow: none;
      padding: 0;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Clock widget ── */
    .clock-widget {
      text-align: center;
      padding: 20px 0 12px;
    }
    #clock {
      font-size: 3.8rem;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }
    #ampm {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-top: 4px;
    }
    #word-of-day {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--card);
      border-radius: 10px;
      border-left: 3px solid var(--blue);
    }
    #word-of-day .wod-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    #word-of-day .wod-word {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--blue);
    }
    #word-of-day .wod-pos {
      font-size: 0.7rem;
      font-style: italic;
      color: var(--muted);
      margin-left: 4px;
    }
    #word-of-day .wod-def {
      font-size: 0.78rem;
      color: var(--text);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ── Weather widget ── */
    .weather-widget {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(74, 144, 217, 0.18), rgba(74, 144, 217, 0.08));
      border-radius: 14px;
    }
    #weather-icon { font-size: 2.6rem; }
    .weather-info { flex: 1; }
    #weather-temp {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }
    #weather-desc {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: capitalize;
      margin-top: 2px;
    }
    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .weather-detail {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .weather-detail-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .weather-detail-value {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── Calendar area (right side) ── */
    .calendar-area {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow: hidden;
    }
    #calendar-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    #events-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #events-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }
    #events-list::-webkit-scrollbar { width: 6px; }
    #events-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    #events-list::-webkit-scrollbar-track { background: transparent; }

    /* ── View toggle tabs ── */
    .view-tabs {
      display: flex;
      gap: 4px;
      background: var(--card-bg-2);
      padding: 4px;
      border-radius: 12px;
      width: fit-content;
    }
    .view-tab {
      padding: 8px 20px;
      border: none;
      background: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-tab.active {
      background: var(--card-bg);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* ── Schedule / event list ── */
    .schedule-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .schedule-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }

    .day-section {
      margin-bottom: 8px;
    }
    .day-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .event-item {
      display: flex;
      align-items: stretch;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .event-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .event-color-bar {
      width: 4px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .event-content { flex: 1; }
    .event-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .event-time {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .event-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
      margin-top: 6px;
    }

    /* ── Month grid view ── */
    .month-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .month-nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 13px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      transition: all 0.15s;
      line-height: 1.6;
    }
    .month-nav-btn:hover { background: var(--bg); }
    .month-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .month-nav-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      min-width: 130px;
      text-align: center;
    }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      height: 100%;
    }
    .month-day-header {
      background: var(--bg);
      text-align: center;
      padding: 10px 4px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .month-day {
      background: var(--card-bg);
      padding: 6px 5px;
      overflow: hidden;
    }
    .month-day.other-month { background: #14181d; opacity: 0.6; }
    .month-day.today-cell  { background: rgba(74, 144, 217, 0.18); }
    .month-day-num {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .month-day-num.today-num {
      background: var(--accent);
      color: #fff;
    }
    .month-event-pill {
      font-size: 0.6rem;
      font-weight: 700;
      color: #fff;
      border-radius: 3px;
      padding: 1px 5px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .month-more {
      font-size: 0.58rem;
      font-weight: 600;
      color: var(--muted);
      padding-left: 3px;
    }

    /* ── Google Calendar connect prompt ── */
    .cal-connect-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 40px;
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      gap: 16px;
    }
    .cal-connect-prompt .icon { font-size: 3rem; }
    .cal-connect-prompt h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
    }
    .cal-connect-prompt p {
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 400px;
      line-height: 1.6;
    }
    .cal-connect-prompt code {
      background: var(--card-bg-2);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
    }

    /* ── No events placeholder ── */
    .no-events {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    .no-events .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .no-events p { font-size: 0.9rem; font-weight: 600; }

    /* ── Loading spinner ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 10px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Sports Sidebar ── */
    .sports-sidebar {
      background: var(--bg);
      border-left: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .sports-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }
    .sports-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sports-teams-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    .sports-team-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .sports-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter:
        drop-shadow(0 0 0.6px rgba(255,255,255,0.95))
        drop-shadow(0 0 0.6px rgba(255,255,255,0.95))
        drop-shadow(0 0 0.6px rgba(255,255,255,0.95));
    }
    .sports-logo-sm {
      width: 26px;
      height: 26px;
      object-fit: contain;
      flex-shrink: 0;
      filter:
        drop-shadow(0 0 0.5px rgba(255,255,255,0.9))
        drop-shadow(0 0 0.5px rgba(255,255,255,0.9));
    }
    /* compact game row (multi-game view, logos only) */
    .sports-games-list { display: flex; flex-direction: column; }
    .sports-game-row {
      display: grid;
      grid-template-columns: auto auto auto auto;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.76rem;
    }
    .sports-game-row:last-child { border-bottom: none; }
    .sports-game-row.is-live .sports-game-status { color: var(--red); }
    .sports-game-away {
      display: flex;
      align-items: center;
    }
    .sports-game-home {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .sports-game-scores {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      font-size: 0.82rem;
      color: var(--text);
      white-space: nowrap;
    }
    .sports-game-sep { color: var(--muted); font-weight: 400; }
    .sports-game-vs { color: var(--muted); font-size: 0.7rem; font-weight: 600; }
    .sports-game-status {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      min-width: 0;
    }
    /* standings (logos only, no team name text) */
    .sports-standings-list { display: flex; flex-direction: column; }
    .sports-standing-row {
      display: grid;
      grid-template-columns: 18px 26px auto auto;
      align-items: center;
      gap: 5px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.74rem;
    }
    .sports-standing-row:last-child { border-bottom: none; }
    .sports-standing-rank {
      color: var(--muted);
      font-weight: 700;
      text-align: right;
      font-size: 0.66rem;
    }
    .sports-standing-record {
      color: var(--muted);
      font-size: 0.68rem;
      white-space: nowrap;
    }
    .sports-standing-pct {
      color: var(--muted);
      font-size: 0.66rem;
      text-align: right;
      white-space: nowrap;
    }
    .sports-team-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sports-team-record {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--muted);
    }
    .sports-score-center {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      min-width: 70px;
    }
    .sports-clock {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      padding: 4px 0;
    }
    .sports-clock.live {
      color: var(--red);
    }
    .sports-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .sports-venue-block {
      flex: 1;
      min-width: 0;
    }
    .sports-venue-name {
      font-weight: 700;
      color: var(--text);
      font-size: 0.72rem;
    }
    .sports-venue-city {
      font-size: 0.66rem;
    }
    .sports-network {
      font-weight: 700;
      font-size: 0.66rem;
      color: var(--accent);
      flex-shrink: 0;
    }
    .sports-lastplay {
      font-size: 0.7rem;
      font-style: italic;
      color: var(--muted);
      line-height: 1.35;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .sports-winprob {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sports-winprob-bar {
      display: flex;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      background: var(--border);
    }
    .sports-winprob-fill-a { background: var(--blue); }
    .sports-winprob-fill-b { background: var(--red);  }
    .sports-winprob-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--muted);
    }
    .sports-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      animation: pulse-red 1.5s ease-in-out infinite;
      display: inline-block;
      margin-left: 6px;
      vertical-align: middle;
    }
    .sports-f1-race {
      text-align: center;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }
    .sports-f1-circuit {
      text-align: center;
      font-size: 0.74rem;
      color: var(--muted);
    }
    .sports-f1-time {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--red);
      padding: 4px 0;
    }
    .sports-f1-countdown {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .sports-f1-leader {
      border-top: 1px solid var(--border);
      padding-top: 8px;
      text-align: center;
    }
    .sports-f1-leader-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .sports-f1-leader-name {
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text);
    }
    .sports-f1-leader-points {
      font-size: 0.7rem;
      color: var(--muted);
    }
    .sports-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      padding: 20px 0;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
        padding: 16px;
        gap: 16px;
      }
      .sidebar > * { flex: 1; min-width: 200px; }
      .sports-sidebar { display: none; }
    }
    @media (max-width: 550px) {
      .header { padding: 12px 16px; }
      .calendar-area { padding: 16px; }
      .sidebar { flex-direction: column; }
      .sports-sidebar { display: none; }
    }

  // ── Clock & Date ──

  // ── Weather (Open-Meteo) ──
  const LAT = -31.9505, LON = 115.8605;
  const WMO_ICONS = {

    51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',

  async function fetchWeather() {

    { word: 'Dauntless',    pos: 'adjective', def: 'Showing fearlessness and determination.' },
    { word: 'Exuberant',    pos: 'adjective', def: 'Filled with lively energy and excitement.' },

    { word: 'Kinetic',      pos: 'adjective', def: 'Relating to or resulting from motion; lively and dynamic.' },

    { word: 'Mirth',        pos: 'noun',      def: 'Amusement expressed in laughter; joyfulness.' },
    { word: 'Nimble',       pos: 'adjective', def: 'Quick and light in movement or thought.' },
    { word: 'Opulent',      pos: 'adjective', def: 'Ostentatiously rich and luxurious.' },
    { word: 'Prudent',      pos: 'adjective', def: 'Acting with care and thought for the future.' },
    { word: 'Radiant',      pos: 'adjective', def: 'Sending out light; looking joyful and happy.' },
    { word: 'Sagacious',    pos: 'adjective', def: 'Having good judgement; wise and perceptive.' },
    { word: 'Tenacity',     pos: 'noun',      def: 'The quality of being very determined and persistent.' },
  ];
  function showWordOfDay() {
    const start = new Date(2026, 0, 1);
    const today = new Date();
    const dayIndex = Math.floor((today - start) / 86400000);
    const entry = WORDS[dayIndex % WORDS.length];
    document.getElementById('wod-word').textContent = entry.word;
    document.getElementById('wod-pos').textContent = entry.pos;
    document.getElementById('wod-def').textContent = entry.def;
  }
  showWordOfDay();

  // ════════════════════════════════════════════════════════════
  // iCal feed loader & parser (RFC 5545)
  // ════════════════════════════════════════════════════════════

  async function fetchFeedWithFallback(feed) {
    for (const proxy of CORS_PROXIES) {
      try {
        const res = await fetch(proxy(feed.url), { signal: AbortSignal.timeout(10000) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        if (!text.includes('BEGIN:VCALENDAR')) throw new Error('not an iCal response');
        return text;
      } catch (e) {
        console.warn(`${feed.name}: proxy ${proxy('').split('?')[0]} failed:`, e.message);
      }
    }
    return null;
  }

  async function fetchAllEvents() {
    const all = [];
    let okCount = 0;
    await Promise.all(ICAL_FEEDS.map(async (feed) => {
      const text = await fetchFeedWithFallback(feed);
      if (text) {
        all.push(...parseICal(text, feed));
        okCount++;
      }
    }));
    return { events: all, okCount };
  }

  function parseICal(text, feed) {
    // RFC 5545 line unfolding
    const unfolded = text.replace(/\r?\n[ \t]/g, '');
    const lines    = unfolded.split(/\r?\n/);

    const rawEvents = [];
    let current     = null;

    for (const line of lines) {
      if (line === 'BEGIN:VEVENT') {
        current = { exdates: [] };
      } else if (line === 'END:VEVENT') {
        if (current && current.start && current.summary) rawEvents.push(current);
        current = null;
      } else if (current) {
        const colonIdx = line.indexOf(':');
        if (colonIdx === -1) continue;
        const propPart = line.substring(0, colonIdx);
        const value    = line.substring(colonIdx + 1);
        const segments = propPart.split(';');
        const propName = segments[0].toUpperCase();
        const params   = segments.slice(1);

        if (propName === 'SUMMARY') {
          current.summary = unescapeICal(value);
        } else if (propName === 'UID') {
          current.uid = value;
        } else if (propName === 'RECURRENCE-ID') {
          current.recurrenceId = value; // modified instance override
        } else if (propName === 'DTSTART') {
          const isDate = params.some(p => /VALUE=DATE\b/i.test(p)) || /^\d{8}$/.test(value);
          current.start    = parseICalDate(value, isDate);
          current.allDay   = isDate;
          current.startRaw = value;
        } else if (propName === 'DTEND') {
          const isDate = params.some(p => /VALUE=DATE\b/i.test(p)) || /^\d{8}$/.test(value);
          current.end = parseICalDate(value, isDate);
        } else if (propName === 'RRULE') {
          current.rrule = value;
        } else if (propName === 'EXDATE') {
          // Multiple EXDATE lines are allowed; each may contain comma-separated values
          value.split(',').forEach(v => {
            const d = parseICalDate(v.trim(), /^\d{8}$/.test(v.trim()));
            if (d && !isNaN(d)) current.exdates.push(d.getTime());
          });
        }
      }
    }

    // Separate override instances (have RECURRENCE-ID) from base events
    const overrides  = {};
    const baseEvents = [];
    for (const ev of rawEvents) {
      if (ev.recurrenceId) {
        if (!overrides[ev.uid]) overrides[ev.uid] = [];
        overrides[ev.uid].push(ev);
      } else {
        baseEvents.push(ev);
      }
    }

    const now       = new Date();
    const winStart  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const winEnd    = new Date(winStart.getTime() + 30 * 86400000);
    const expanded  = [];

    for (const ev of baseEvents) {
      try {
        if (!ev.rrule) {
          expanded.push({ ...ev, feed });
          continue;
        }
        const duration  = ev.end ? (ev.end - ev.start) : 0;
        const instances = expandRRule(ev.rrule, ev.start, ev.allDay, winStart, winEnd, ev.exdates);
        const uidOverrides = overrides[ev.uid] || [];

        for (const occStart of instances) {
          const overrideMatch = uidOverrides.find(o => {
            const rid = parseICalDate(o.recurrenceId, /^\d{8}$/.test(o.recurrenceId));
            return rid && Math.abs(rid - occStart) < 86400000;
          });
          if (overrideMatch) {
            if (overrideMatch.start >= winStart && overrideMatch.start < winEnd) {
              expanded.push({ ...ev, ...overrideMatch, feed, exdates: [] });
            }
          } else {
            const occEnd = duration ? new Date(occStart.getTime() + duration) : null;
            expanded.push({ ...ev, start: occStart, end: occEnd, feed });
          }
        }
      } catch (err) {
        console.warn('Failed to expand event:', ev.summary, err);
        // Fall back to single occurrence so a bad RRULE doesn't lose the event entirely
        if (ev.start >= winStart && ev.start < winEnd) expanded.push({ ...ev, feed });
      }
    }

    return expanded;
  }

  function expandRRule(rruleStr, dtstart, allDay, winStart, winEnd, exdates) {
    const params = {};
    rruleStr.split(';').forEach(part => {
      const [k, v] = part.split('=');
      params[k.toUpperCase()] = v;
    });

    const freq  = (params.FREQ || '').toUpperCase();
    const count = params.COUNT ? +params.COUNT : Infinity;
    let   until = null;
    if (params.UNTIL) {
      until = parseICalDate(params.UNTIL, /^\d{8}$/.test(params.UNTIL));
    }

    // BYDAY for weekly: e.g. "MO,WE,FR"
    const byDay = params.BYDAY ? params.BYDAY.split(',').map(d => d.trim().toUpperCase()) : null;
    const dayMap = { SU: 0, MO: 1, TU: 2, WE: 3, TH: 4, FR: 5, SA: 6 };
    const interval = params.INTERVAL ? +params.INTERVAL : 1;

    const occurrences = [];
    let cur  = new Date(dtstart);
    let n    = 0;
    let iter = 0;
    const MAX_ITER = 1000;

    // Stop searching after a year past the window
    const hardLimit = new Date(winEnd.getTime() + 366 * 86400000);

    // If dtstart is far in the past, fast-forward cur to near the window start
    // to avoid iterating thousands of past occurrences for old recurring events.
    if (freq === 'DAILY' && cur < winStart) {
      const daysBehind = Math.floor((winStart - cur) / 86400000);
      const skipUnits  = Math.floor(daysBehind / interval);
      cur.setDate(cur.getDate() + skipUnits * interval);
    } else if (freq === 'WEEKLY' && cur < winStart) {
      const weeksBehind = Math.floor((winStart - cur) / (7 * 86400000));
      const skipUnits   = Math.floor(weeksBehind / interval);
      cur.setDate(cur.getDate() + skipUnits * 7 * interval);
    } else if (freq === 'MONTHLY' && cur < winStart) {
      const monthsBehind = (winStart.getFullYear() - cur.getFullYear()) * 12 + (winStart.getMonth() - cur.getMonth());
      const skipUnits    = Math.max(0, Math.floor(monthsBehind / interval) - 1);
      cur.setMonth(cur.getMonth() + skipUnits * interval);
    } else if (freq === 'YEARLY' && cur < winStart) {
      const yearsBehind = winStart.getFullYear() - cur.getFullYear();
      const skipUnits   = Math.max(0, yearsBehind - 1);
      cur.setFullYear(cur.getFullYear() + skipUnits * interval);
    }

    while (n < count && iter < MAX_ITER) {
      iter++;
      if (until && cur > until) break;
      if (cur > hardLimit) break;

      const candidates = [];
      if (freq === 'WEEKLY' && byDay) {
        // Generate all matching weekdays in the current week anchor
        const weekStart = new Date(cur);
        weekStart.setDate(weekStart.getDate() - weekStart.getDay()); // Sunday
        for (const dCode of byDay) {
          const dow = dayMap[dCode];
          if (dow == null) continue;
          const candidate = new Date(weekStart);
          candidate.setDate(weekStart.getDate() + dow);
          // Copy time from dtstart
          candidate.setHours(cur.getHours(), cur.getMinutes(), cur.getSeconds(), 0);
          candidates.push(candidate);
        }
        candidates.sort((a, b) => a - b);
      } else {
        candidates.push(new Date(cur));
      }

      for (const occ of candidates) {
        if (until && occ > until) continue;
        if (occ < dtstart) continue; // don't emit before series start
        if (exdates.includes(occ.getTime())) { n++; continue; }
        if (occ >= winStart && occ < winEnd) {
          occurrences.push(new Date(occ));
        }
        n++;
        if (n >= count) break;
      }

      // Advance by interval
      if (freq === 'DAILY') {
        cur.setDate(cur.getDate() + interval);
      } else if (freq === 'WEEKLY') {
        cur.setDate(cur.getDate() + 7 * interval);
      } else if (freq === 'MONTHLY') {
        cur.setMonth(cur.getMonth() + interval);
      } else if (freq === 'YEARLY') {
        cur.setFullYear(cur.getFullYear() + interval);
      } else {
        break; // unknown freq
      }

      // If we've passed the window and aren't generating any new ones, stop early
      if (cur > winEnd && !until && count === Infinity) break;
    }

    return occurrences;
  }

  function parseICalDate(value, isDate) {
    if (isDate) {
      // YYYYMMDD — local midnight
      const y = +value.slice(0, 4);
      const m = +value.slice(4, 6) - 1;
      const d = +value.slice(6, 8);
      return new Date(y, m, d);
    }
    // YYYYMMDDTHHmmss[Z]
    const y   = +value.slice(0, 4);
    const m   = +value.slice(4, 6) - 1;
    const d   = +value.slice(6, 8);
    const h   = +value.slice(9, 11);
    const min = +value.slice(11, 13);
    const s   = +value.slice(13, 15) || 0;
    if (value.endsWith('Z')) return new Date(Date.UTC(y, m, d, h, min, s));
    return new Date(y, m, d, h, min, s);
  }

  function unescapeICal(value) {
    return value
      .replace(/\\n/gi, '\n')
      .replace(/\\,/g, ',')
      .replace(/\\;/g, ';')
      .replace(/\\\\/g, '\\');
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function renderEvents(events) {
    const now           = new Date();
    const todayStart    = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const tomorrowStart = new Date(todayStart.getTime() + 86400000);
    const cutoff        = new Date(todayStart.getTime() + 30 * 86400000);

    const seen = new Set();
    const visible = events
      .filter(ev => {
        const end = ev.end || ev.start;
        if (end < todayStart || ev.start >= cutoff) return false;
        // Dedup events that share the same UID + start time (recurring overlaps)
        const key = (ev.uid || ev.summary) + '|' + ev.start.getTime();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .sort((a, b) => a.start - b.start)
      .slice(0, 20);

    const list = document.getElementById('events-list');
    if (!visible.length) {
      list.innerHTML = '<div class="no-events"><div class="icon">🎉</div><p>No upcoming events</p></div>';
      return;
    }

    // Group events by day
    const groups = new Map();
    visible.forEach(ev => {
      const d = ev.start;
      const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      if (!groups.has(key)) groups.set(key, { date: new Date(d.getFullYear(), d.getMonth(), d.getDate()), events: [] });
      groups.get(key).events.push(ev);
    });

    let html = '';
    for (const { date, events: dayEvents } of groups.values()) {
      const label = dayHeader(date, todayStart, tomorrowStart);
      html += `<div class="day-section"><div class="day-label">${label}</div><div class="event-list">`;
      dayEvents.forEach(ev => html += renderEvent(ev));
      html += `</div></div>`;
    }
    list.innerHTML = html;
  }

  function dayHeader(date, todayStart, tomorrowStart) {
    if (date.getTime() === todayStart.getTime())    return 'Today';
    if (date.getTime() === tomorrowStart.getTime()) return 'Tomorrow';
    return DAYS[date.getDay()] + ', ' + date.getDate() + ' ' + MONTHS[date.getMonth()];
  }

  function renderEvent(ev) {
    const color = ev.feed.color;
    const tagBg = color + '20';
    let timeStr = 'All day';
    if (!ev.allDay) {
      timeStr = formatTime(ev.start);
      if (ev.end && ev.end > ev.start) timeStr += ' – ' + formatTime(ev.end);
    }
    return `
      <div class="event-item event-${ev.feed.type}">
        <div class="event-color-bar" style="background: ${color}"></div>
        <div class="event-content">
          <div class="event-title">${escapeHtml(ev.summary)}</div>
          <div class="event-time">${timeStr}</div>
          <span class="event-tag" style="background:${tagBg}; color:${color}">${escapeHtml(ev.feed.name)}</span>
        </div>
      </div>`;
  }

  let hasRenderedCalendar = false;

  async function refreshCalendar() {
    const loading = document.getElementById('events-loading');
    const list    = document.getElementById('events-list');
    if (!list.innerHTML.trim()) loading.style.display = 'flex';
    try {
      const { events, okCount } = await fetchAllEvents();
      // If every feed failed this cycle, keep the last good render rather than
      // wiping it to "No upcoming events". Only render on a successful fetch.
      if (okCount > 0) {
        renderEvents(events);
        hasRenderedCalendar = true;
      } else if (!hasRenderedCalendar) {
        list.innerHTML = '<div class="no-events"><div class="icon">⚠️</div><p>Could not load events</p></div>';
      }
    } catch (e) {
      console.error('Calendar refresh failed:', e);
      if (!hasRenderedCalendar) {
        list.innerHTML = '<div class="no-events"><div class="icon">⚠️</div><p>Could not load events</p></div>';
      }
    } finally {
      loading.style.display = 'none';
    }
  }

  refreshCalendar();
  setInterval(refreshCalendar, 15 * 60 * 1000);

  function formatTime(d) {
    let h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ════════════════════════════════════════════════════════════
  // Sports Sidebar (NBA, AFL, F1)
  // ════════════════════════════════════════════════════════════

  function extractGameData(event, sportLabel) {
    if (!event) return null;
    const comp = event.competitions?.[0];
    if (!comp || !comp.competitors || comp.competitors.length < 2) return null;

    const home = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors[0];
    const away = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors[1];

    const status = comp.status?.type || event.status?.type || {};
    const state  = status.state || '';   // 'pre' | 'in' | 'post'
    const isLive = state === 'in';
    const venueAddr = event.venue?.address || {};
    const sit = comp.situation || {};

    const cityState = [venueAddr.city, venueAddr.state].filter(Boolean).join(', ');

    // For upcoming games, ESPN's shortDetail uses the league's local timezone
    // (e.g. "5/8 - 2:30 AM EDT"). Replace with a Perth-formatted timestamp.
    let statusText = status.shortDetail || status.detail || status.description || '';
    if (state === 'pre' && event.date) {
      const d = new Date(event.date);
      if (!isNaN(d)) {
        statusText = d.toLocaleString('en-AU', {
          timeZone: 'Australia/Perth',
          weekday:  'short',
          day:      'numeric',
          month:    'short',
          hour:     'numeric',
          minute:   '2-digit',
          hour12:   true,
        }) + ' AWST';
      }
    }

    return {
      sport:    sportLabel,
      home: {
        name:   home.team?.shortDisplayName || home.team?.name || '?',
        logo:   home.team?.logo,
        score:  home.score,
        record: home.records?.[0]?.summary || '',
      },
      away: {
        name:   away.team?.shortDisplayName || away.team?.name || '?',
        logo:   away.team?.logo,
        score:  away.score,
        record: away.records?.[0]?.summary || '',
      },
      statusText,
      state,
      isLive,
      isFinal:    state === 'post',
      isUpcoming: state === 'pre',
      venueName:  event.venue?.fullName || '',
      venueCity:  cityState,
      network:    comp.broadcasts?.[0]?.names?.[0] || '',
      lastPlay:   sit.lastPlay?.text || '',
      homeWinPct: sit.lastPlay?.probability?.homeWinPercentage ?? sit.homeWinPercentage,
      awayWinPct: sit.lastPlay?.probability?.awayWinPercentage ?? sit.awayWinPercentage,
      date: event.date,
    };
  }

  function perthDateKey(date) {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Australia/Perth',
      year:  'numeric',
      month: '2-digit',
      day:   '2-digit',
    }).format(date); // "YYYY-MM-DD"
  }

  function ymd(date) {
    const y = date.getUTCFullYear();
    const m = String(date.getUTCMonth() + 1).padStart(2, '0');
    const d = String(date.getUTCDate()).padStart(2, '0');
    return `${y}${m}${d}`;
  }

  async function fetchLeagueData(sportPath, label) {
    try {
      // Pull a 10-day window: past 3 days through next 7. Works for both
      // regular season and playoffs where games are sparser.
      const now   = new Date();
      const start = new Date(now.getTime() - 3 * 86400000);
      const end   = new Date(now.getTime() + 7 * 86400000);
      const url   = `https://site.api.espn.com/apis/site/v2/sports/${sportPath}/scoreboard?dates=${ymd(start)}-${ymd(end)}`;

      const scoreRes = await fetch(url);
      if (!scoreRes.ok) return { label, games: [], fallbackKind: null };
      const scoreData = await scoreRes.json();
      const allEvents = (scoreData.events || []).filter(e => e.date);

      const todayKey  = perthDateKey(new Date());
      const todayGames = allEvents.filter(e => perthDateKey(new Date(e.date)) === todayKey);

      if (todayGames.length > 0) {
        return {
          label,
          games: todayGames.map(e => extractGameData(e, label)).filter(Boolean),
          fallbackKind: null,
        };
      }

      // No games today — find next upcoming game (any future date)
      const nowMs = now.getTime();
      const upcoming = allEvents
        .filter(e => new Date(e.date).getTime() > nowMs)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      if (upcoming.length > 0) {
        const game = extractGameData(upcoming[0], label);
        return game ? { label, games: [game], fallbackKind: 'next' } : { label, games: [], fallbackKind: null };
      }

      // No upcoming games — show most recent completed game
      const recent = allEvents
        .filter(e => new Date(e.date).getTime() <= nowMs)
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      if (recent.length > 0) {
        const game = extractGameData(recent[0], label);
        return game ? { label, games: [game], fallbackKind: 'recent' } : { label, games: [], fallbackKind: null };
      }

      return { label, games: [], fallbackKind: null };
    } catch (e) {
      console.warn(label + ' fetch failed:', e);
      return { label, games: [], fallbackKind: null };
    }
  }

  async function fetchNBAData() { return fetchLeagueData('basketball/nba', 'NBA'); }
  async function fetchAFLData() { return fetchLeagueData('australian-football/afl', 'AFL'); }

  async function fetchF1Data() {
    try {
      const [nextRes, standingsRes] = await Promise.all([
        fetch('https://api.jolpi.ca/ergast/f1/current/next.json'),
        fetch('https://api.jolpi.ca/ergast/f1/current/driverStandings.json'),
      ]);
      if (!nextRes.ok) return null;
      const nextData      = await nextRes.json();
      const standingsData = standingsRes.ok ? await standingsRes.json() : null;

      const race = nextData.MRData?.RaceTable?.Races?.[0];
      if (!race) return null;

      // Strip trailing Z so we don't double it; Ergast returns time like "06:00:00Z"
      const timeStr  = (race.time || '00:00:00Z').replace(/Z$/, '') + 'Z';
      const raceDate = new Date(race.date + 'T' + timeStr);
      if (isNaN(raceDate)) return null;

      const leader = standingsData?.MRData?.StandingsTable?.StandingsLists?.[0]?.DriverStandings?.[0];

      return {
        raceName: race.raceName || race.name || '',
        circuit:  race.Circuit?.circuitName || '',
        country:  race.Circuit?.Location?.country || '',
        date:     raceDate,
        leader:   leader ? {
          name:   `${leader.Driver?.givenName} ${leader.Driver?.familyName}`,
          points: leader.points,
          team:   leader.Constructors?.[0]?.name,
        } : null,
      };
    } catch (e) {
      console.warn('F1 fetch failed:', e);
      return null;
    }
  }

  // ── Renderers ────────────────────────────────────────────────────────────

  function logoImg(url, name) {
    return url
      ? `<img src="${url}" class="sports-logo" alt="${escapeHtml(name)}" />`
      : `<div class="sports-logo"></div>`;
  }

  function emptyCard(label) {
    return `<div class="sports-card-header"><span>${label}</span></div>
            <div class="sports-empty">No data</div>`;
  }

  function logoImgSm(url, name) {
    return url
      ? `<img src="${url}" class="sports-logo-sm" alt="${escapeHtml(name)}" />`
      : `<div class="sports-logo-sm"></div>`;
  }

  function renderCompactGame(g) {
    const liveDot   = g.isLive ? '<span class="sports-live-dot"></span>' : '';
    const hasScore  = g.isLive || g.isFinal;
    const awayScore = g.away.score ?? '';
    const homeScore = g.home.score ?? '';
    const scoresHtml = hasScore
      ? `<div class="sports-game-scores">
           <span>${escapeHtml(String(awayScore))}</span>
           <span class="sports-game-sep">-</span>
           <span>${escapeHtml(String(homeScore))}</span>
         </div>`
      : `<div class="sports-game-scores"><span class="sports-game-vs">vs</span></div>`;

    return `
      <div class="sports-game-row${g.isLive ? ' is-live' : ''}">
        <div class="sports-game-away">${logoImgSm(g.away.logo, g.away.name)}</div>
        ${scoresHtml}
        <div class="sports-game-home">${logoImgSm(g.home.logo, g.home.name)}</div>
        <div class="sports-game-status">${escapeHtml(g.statusText)}${liveDot}</div>
      </div>`;
  }

  function renderStandingRow(s, rank) {
    const logo = s.team?.logo
      ? `<img src="${s.team.logo}" class="sports-logo-sm" alt="${escapeHtml(s.team.shortDisplayName || '')}" />`
      : '<div class="sports-logo-sm"></div>';
    return `
      <div class="sports-standing-row">
        <span class="sports-standing-rank">${rank}</span>
        ${logo}
        <span class="sports-standing-record">${s.wins}-${s.losses}</span>
        <span class="sports-standing-pct">${escapeHtml(s.pctDisplay)}</span>
      </div>`;
  }

  function renderSingleGame(g) {
    const hasScore = g.isLive || g.isFinal;
    const awayScore = g.away.score ?? '';
    const homeScore = g.home.score ?? '';
    const scoreHtml = hasScore
      ? `<div class="sports-score-center">${escapeHtml(String(awayScore))} – ${escapeHtml(String(homeScore))}</div>`
      : `<div class="sports-score-center" style="font-size:1rem;color:var(--muted)">vs</div>`;

    const clockClass = g.isLive ? 'sports-clock live' : 'sports-clock';

    let metaHtml = '';
    if (g.venueName || g.network) {
      metaHtml = `<div class="sports-meta-row">
        <div class="sports-venue-block">
          ${g.venueName ? `<div class="sports-venue-name">${escapeHtml(g.venueName)}</div>` : ''}
          ${g.venueCity ? `<div class="sports-venue-city">${escapeHtml(g.venueCity)}</div>` : ''}
        </div>
        ${g.network ? `<div class="sports-network">${escapeHtml(g.network)}</div>` : ''}
      </div>`;
    }

    let lastPlayHtml = '';
    if (g.isLive && g.lastPlay) {
      lastPlayHtml = `<div class="sports-lastplay">${escapeHtml(g.lastPlay)}</div>`;
    }

    let winProbHtml = '';
    if (g.isLive && g.awayWinPct != null && g.homeWinPct != null) {
      const aPct = Math.round(g.awayWinPct * 100);
      const hPct = Math.round(g.homeWinPct * 100);
      winProbHtml = `
        <div class="sports-winprob">
          <div class="sports-winprob-bar">
            <div class="sports-winprob-fill-a" style="width:${aPct}%"></div>
            <div class="sports-winprob-fill-b" style="width:${hPct}%"></div>
          </div>
          <div class="sports-winprob-labels">
            <span>${escapeHtml(g.away.name)} ${aPct}%</span>
            <span>${hPct}% ${escapeHtml(g.home.name)}</span>
          </div>
        </div>`;
    }

    return `
      <div class="sports-teams-row">
        <div class="sports-team-block">
          ${logoImg(g.away.logo, g.away.name)}
          <div class="sports-team-name">${escapeHtml(g.away.name)}</div>
          ${g.away.record ? `<div class="sports-team-record">${escapeHtml(g.away.record)}</div>` : ''}
        </div>
        ${scoreHtml}
        <div class="sports-team-block">
          ${logoImg(g.home.logo, g.home.name)}
          <div class="sports-team-name">${escapeHtml(g.home.name)}</div>
          ${g.home.record ? `<div class="sports-team-record">${escapeHtml(g.home.record)}</div>` : ''}
        </div>
      </div>
      <div class="${clockClass}">${escapeHtml(g.statusText)}</div>
      ${metaHtml}${lastPlayHtml}${winProbHtml}`;
  }

  function renderLeagueCard(cardEl, data) {
    if (!data || !data.games.length) {
      cardEl.innerHTML = emptyCard(data?.label || '');
      return;
    }
    const { label, games, fallbackKind } = data;

    const hasLive  = games.some(g => g.isLive);
    const liveGame = games.find(g => g.isLive);
    const liveDot  = hasLive ? '<span class="sports-live-dot"></span>' : '';

    // Full format: exactly 1 game (or fallback), OR at least one live game
    if (games.length === 1 || hasLive) {
      const featured = liveGame || games[0];
      let subtitle = 'Today';
      if (hasLive)                  subtitle = 'Live';
      else if (fallbackKind === 'next')   subtitle = 'Next game';
      else if (fallbackKind === 'recent') subtitle = 'Last game';
      cardEl.innerHTML = `
        <div class="sports-card-header">
          <span>${label}${liveDot}</span>
          <span>${subtitle}</span>
        </div>
        ${renderSingleGame(featured)}`;
    } else {
      cardEl.innerHTML = `
        <div class="sports-card-header">
          <span>${label}</span>
          <span>${games.length} games today</span>
        </div>
        <div class="sports-games-list">${games.map(g => renderCompactGame(g)).join('')}</div>`;
    }
  }

  function renderF1Card(data) {
    const card = document.getElementById('f1-card');
    if (!data) { card.innerHTML = emptyCard('F1'); return; }

    const now = new Date();
    const msUntil = data.date - now;
    let countdown;
    if (msUntil < 0) {
      countdown = 'Race in progress or just finished';
    } else {
      const totalH = Math.floor(msUntil / 3600000);
      const days   = Math.floor(totalH / 24);
      const hours  = totalH % 24;
      countdown = days > 0 ? `Starts in ${days}d ${hours}h` : `Starts in ${hours}h`;
    }

    const raceTime = data.date.toLocaleString('en-AU', {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
      timeZone: 'Australia/Perth',
    });

    card.innerHTML = `
      <div class="sports-card-header"><span>F1</span><span>Next Race</span></div>
      <div class="sports-f1-race">${escapeHtml(data.raceName)}</div>
      <div class="sports-f1-circuit">${escapeHtml(data.circuit)}${data.country ? ' • ' + escapeHtml(data.country) : ''}</div>
      <div class="sports-f1-time">${raceTime} AWST</div>
      <div class="sports-f1-countdown">${countdown}</div>
      ${data.leader ? `
        <div class="sports-f1-leader">
          <div class="sports-f1-leader-label">Championship Leader</div>
          <div class="sports-f1-leader-name">${escapeHtml(data.leader.name)}</div>
          <div class="sports-f1-leader-points">${escapeHtml(data.leader.points)} pts${data.leader.team ? ' • ' + escapeHtml(data.leader.team) : ''}</div>
        </div>` : ''}
    `;
  }

  async function refreshSports() {
    const [nba, afl, f1] = await Promise.all([
      fetchNBAData(),
      fetchAFLData(),
      fetchF1Data(),
    ]);
    renderLeagueCard(document.getElementById('nba-card'), nba);
    renderLeagueCard(document.getElementById('afl-card'), afl);
    renderF1Card(f1);
  }

  refreshSports();
  setInterval(refreshSports, 60 * 1000);

</script>
