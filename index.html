<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --panel:     rgba(255,255,255,0.05);
      --border:    rgba(255,255,255,0.10);
      --accent1:   #ff3f6c;
      --accent2:   #00e5ff;
      --accent3:   #ffe135;
      --accent4:   #7c3aed;
      --text:      #f0f0f0;
      --muted:     rgba(240,240,240,0.45);
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --radius:    18px;
      --gap:       18px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 20%, rgba(255,63,108,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 90% 80%, rgba(0,229,255,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(124,58,237,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 70% 30% at 80% 10%, rgba(255,225,53,0.10) 0%, transparent 70%);
      animation: bgShift 20s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    .layout {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: var(--gap);
      padding: var(--gap);
      height: 100vh;
    }

    /* ── Panel base ── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      padding: 24px 28px;
      overflow: hidden;
    }

    /* ── TOP LEFT: Clock + Date ── */
    .clock-panel {
      grid-column: 1; grid-row: 1;
      display: flex; flex-direction: column; justify-content: center;
    }
    .clock-time {
      font-family: var(--font-display);
      font-size: clamp(72px, 9vw, 120px);
      line-height: 1;
      color: var(--accent1);
      letter-spacing: 2px;
    }
    .clock-ampm {
      font-family: var(--font-display);
      font-size: clamp(28px, 3.5vw, 48px);
      color: var(--accent1);
      opacity: 0.7;
      margin-left: 8px;
    }
    .clock-date {
      font-family: var(--font-display);
      font-size: clamp(22px, 2.8vw, 38px);
      color: var(--accent3);
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* ── TOP RIGHT: Weather ── */
    .weather-panel {
      grid-column: 2; grid-row: 1;
      display: flex; flex-direction: column; justify-content: center;
    }
    .weather-location {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .weather-main {
      display: flex; align-items: center; gap: 16px;
    }
    .weather-icon { font-size: clamp(42px, 5vw, 64px); }
    .weather-temp {
      font-family: var(--font-display);
      font-size: clamp(52px, 6.5vw, 86px);
      color: var(--accent2);
      line-height: 1;
    }
    .weather-desc {
      font-size: clamp(14px, 1.6vw, 20px);
      color: var(--muted);
      margin-top: 2px;
    }
    .weather-stats {
      display: flex; gap: 20px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .weather-stat {
      display: flex; flex-direction: column;
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
    }
    .stat-val {
      font-size: clamp(13px, 1.4vw, 17px);
      font-weight: 600;
      color: var(--text);
    }

    /* ── BOTTOM: Calendar (spans full width) ── */
    .cal-panel {
      grid-column: 1 / -1; grid-row: 2;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .cal-title {
      font-family: var(--font-display);
      font-size: clamp(20px, 2.5vw, 32px);
      color: var(--accent3);
      letter-spacing: 1px;
    }
    .cal-status {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .cal-events {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }
    .cal-events::-webkit-scrollbar { width: 4px; }
    .cal-events::-webkit-scrollbar-track { background: transparent; }
    .cal-events::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .event-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent1);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 4px;
      animation: fadeIn 0.3s ease;
    }
    .event-card.family { border-left-color: var(--accent2); }
    .event-card.today  { background: rgba(255,63,108,0.08); }
    .event-card.today.family { background: rgba(0,229,255,0.08); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .event-when {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
    }
    .event-when.today-label { color: var(--accent1); font-weight: 700; }
    .event-when.today-label.family-label { color: var(--accent2); }
    .event-title {
      font-size: clamp(13px, 1.3vw, 16px);
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .event-source {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .cal-loading, .cal-error, .cal-empty {
      color: var(--muted);
      font-size: 14px;
      padding: 20px 0;
      text-align: center;
      letter-spacing: 1px;
      grid-column: 1 / -1;
    }
    .cal-error { color: var(--accent1); }

    /* Section divider label */
    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      padding: 6px 0 4px;
      grid-column: 1 / -1;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- Clock -->
  <div class="panel clock-panel">
    <div>
      <span class="clock-time" id="clock-time">12:00</span>
      <span class="clock-ampm" id="clock-ampm">AM</span>
    </div>
    <div class="clock-date" id="clock-date">Monday, 1 January</div>
  </div>

  <!-- Weather -->
  <div class="panel weather-panel">
    <div class="weather-location">📍 Perth, WA</div>
    <div class="weather-main">
      <span class="weather-icon" id="weather-icon">🌤️</span>
      <div>
        <div class="weather-temp" id="weather-temp">--°</div>
        <div class="weather-desc" id="weather-desc">Loading…</div>
      </div>
    </div>
    <div class="weather-stats">
      <div class="weather-stat">
        <span class="stat-label">Feels Like</span>
        <span class="stat-val" id="feels-like">--</span>
      </div>
      <div class="weather-stat">
        <span class="stat-label">Humidity</span>
        <span class="stat-val" id="humidity">--</span>
      </div>
      <div class="weather-stat">
        <span class="stat-label">Wind</span>
        <span class="stat-val" id="wind">--</span>
      </div>
      <div class="weather-stat">
        <span class="stat-label">High / Low</span>
        <span class="stat-val" id="highlow">-- / --</span>
      </div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="panel cal-panel">
    <div class="cal-header">
      <div class="cal-title">Upcoming Events</div>
      <div class="cal-status" id="cal-status">Loading…</div>
    </div>
    <div class="cal-events" id="cal-events">
      <div class="cal-loading">Fetching calendars…</div>
    </div>
  </div>

</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const ICAL_FEEDS = [
  {
    url: 'https://calendar.google.com/calendar/ical/sleqamail%40gmail.com/private-0058b4cb80d75c4f598b7c3c5252e1e3/basic.ics',
    label: 'Personal',
    type: 'personal'
  },
  {
    url: 'https://calendar.google.com/calendar/ical/family15578277438172803939%40group.calendar.google.com/private-d51ecb438107614a12b31e81b25875bd/basic.ics',
    label: 'Family',
    type: 'family'
  }
];

// CORS proxy — needed because browsers block direct cross-origin iCal fetches
// corsproxy.io is free and reliable for this use case
const PROXY = 'https://corsproxy.io/?';

// ── CLOCK ───────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock-time').textContent = `${h}:${String(m).padStart(2,'0')}`;
  document.getElementById('clock-ampm').textContent = ampm;
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('clock-date').textContent =
    `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
}
updateClock();
setInterval(updateClock, 1000);

// ── WEATHER ─────────────────────────────────────────────────────────────────
const WMO = {
  0:'Clear Sky',1:'Mainly Clear',2:'Partly Cloudy',3:'Overcast',
  45:'Foggy',48:'Icy Fog',51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',
  61:'Light Rain',63:'Rain',65:'Heavy Rain',71:'Light Snow',73:'Snow',75:'Heavy Snow',
  80:'Showers',81:'Rain Showers',82:'Heavy Showers',95:'Thunderstorm',96:'Hail Storm',99:'Heavy Hail'
};
const WMO_ICON = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',
  71:'🌨️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};
async function fetchWeather() {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-31.9505&longitude=115.8605&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Australia%2FPerth&forecast_days=1');
    const d = await r.json();
    const c = d.current, day = d.daily;
    const code = c.weather_code;
    document.getElementById('weather-icon').textContent = WMO_ICON[code] ?? '🌡️';
    document.getElementById('weather-temp').textContent = Math.round(c.temperature_2m) + '°C';
    document.getElementById('weather-desc').textContent = WMO[code] ?? 'Unknown';
    document.getElementById('feels-like').textContent = Math.round(c.apparent_temperature) + '°C';
    document.getElementById('humidity').textContent = c.relative_humidity_2m + '%';
    document.getElementById('wind').textContent = Math.round(c.wind_speed_10m) + ' km/h';
    document.getElementById('highlow').textContent =
      Math.round(day.temperature_2m_max[0]) + ' / ' + Math.round(day.temperature_2m_min[0]) + '°C';
  } catch(e) {
    document.getElementById('weather-desc').textContent = 'Unavailable';
  }
}
fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000);

// ── ICAL PARSER ─────────────────────────────────────────────────────────────
function parseIcalDate(str) {
  if (!str) return null;
  // All-day: YYYYMMDD
  if (/^\d{8}$/.test(str)) {
    return new Date(
      parseInt(str.slice(0,4)),
      parseInt(str.slice(4,6)) - 1,
      parseInt(str.slice(6,8))
    );
  }
  // DateTime: YYYYMMDDTHHmmssZ or YYYYMMDDTHHmmss
  if (/^\d{8}T\d{6}/.test(str)) {
    const y = str.slice(0,4), mo = str.slice(4,6), d = str.slice(6,8);
    const h = str.slice(9,11), mi = str.slice(11,13), s = str.slice(13,15);
    if (str.endsWith('Z')) return new Date(`${y}-${mo}-${d}T${h}:${mi}:${s}Z`);
    return new Date(`${y}-${mo}-${d}T${h}:${mi}:${s}`);
  }
  return null;
}

function extractValue(line) {
  // Handle lines like "DTSTART;TZID=...:VALUE" or "SUMMARY:VALUE"
  const colonIdx = line.indexOf(':');
  return colonIdx >= 0 ? line.slice(colonIdx + 1).trim() : '';
}

function parseIcal(text) {
  // Unfold lines (RFC 5545: continuation lines start with space/tab)
  const unfolded = text.replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '');
  const lines = unfolded.split(/\r\n|\n/);

  const events = [];
  let current = null;

  for (const line of lines) {
    if (line.startsWith('BEGIN:VEVENT')) {
      current = {};
    } else if (line.startsWith('END:VEVENT') && current) {
      events.push(current);
      current = null;
    } else if (current) {
      const key = line.split(':')[0].split(';')[0].toUpperCase();
      const val = extractValue(line);
      if (key === 'SUMMARY')  current.summary = val.replace(/\\n/g, ' ').replace(/\\,/g, ',');
      if (key === 'DTSTART')  current.dtstart = val;
      if (key === 'DTEND')    current.dtend   = val;
      if (key === 'DURATION') current.duration = val;
      if (key === 'RRULE')    current.rrule   = val; // flag recurring
    }
  }
  return events;
}

function eventStartDate(ev) {
  return parseIcalDate(ev.dtstart);
}

function isAllDay(ev) {
  return ev.dtstart && /^\d{8}$/.test(ev.dtstart);
}

function formatEventTime(ev) {
  const start = eventStartDate(ev);
  if (!start) return '';
  if (isAllDay(ev)) return 'All Day';
  return start.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function formatEventDay(ev, today) {
  const start = eventStartDate(ev);
  if (!start) return '';
  const startMidnight = new Date(start); startMidnight.setHours(0,0,0,0);
  const todayMidnight = new Date(today); todayMidnight.setHours(0,0,0,0);
  const diff = Math.round((startMidnight - todayMidnight) / 86400000);
  if (diff === 0) return 'TODAY';
  if (diff === 1) return 'TOMORROW';
  return start.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
}

// ── FETCH + RENDER CALENDARS ─────────────────────────────────────────────────
async function fetchCalendar(feed) {
  const proxyUrl = PROXY + encodeURIComponent(feed.url);
  const r = await fetch(proxyUrl);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const text = await r.text();
  const events = parseIcal(text);
  return events.map(ev => ({ ...ev, feedLabel: feed.label, feedType: feed.type }));
}

async function loadCalendars() {
  const container = document.getElementById('cal-events');
  const status    = document.getElementById('cal-status');

  const now   = new Date();
  const today = new Date(now); today.setHours(0,0,0,0);
  const cutoff = new Date(today); cutoff.setDate(today.getDate() + 30); // show 30 days ahead

  try {
    const results = await Promise.allSettled(ICAL_FEEDS.map(fetchCalendar));

    let allEvents = [];
    let errors = [];

    results.forEach((r, i) => {
      if (r.status === 'fulfilled') allEvents = allEvents.concat(r.value);
      else errors.push(ICAL_FEEDS[i].label);
    });

    if (errors.length > 0) {
      status.textContent = `⚠️ Failed: ${errors.join(', ')}`;
    } else {
      status.textContent = `Updated ${now.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', hour12: true })}`;
    }

    // Filter: upcoming within 30 days, skip recurring events with no clear start
    const upcoming = allEvents.filter(ev => {
      const start = eventStartDate(ev);
      if (!start) return false;
      const startMidnight = new Date(start); startMidnight.setHours(0,0,0,0);
      return startMidnight >= today && startMidnight <= cutoff;
    });

    // Sort by start date
    upcoming.sort((a, b) => {
      const da = eventStartDate(a), db = eventStartDate(b);
      return da - db;
    });

    container.innerHTML = '';

    if (upcoming.length === 0 && errors.length === 0) {
      container.innerHTML = '<div class="cal-empty">No events in the next 30 days</div>';
      return;
    }

    if (upcoming.length === 0 && errors.length > 0) {
      container.innerHTML = `<div class="cal-error">Couldn't load calendars. Check your network or iCal URLs.</div>`;
      return;
    }

    // Group: today first, then upcoming
    const todayEvents    = upcoming.filter(ev => {
      const s = eventStartDate(ev); const sm = new Date(s); sm.setHours(0,0,0,0);
      return sm.getTime() === today.getTime();
    });
    const futureEvents   = upcoming.filter(ev => {
      const s = eventStartDate(ev); const sm = new Date(s); sm.setHours(0,0,0,0);
      return sm.getTime() !== today.getTime();
    });

    if (todayEvents.length > 0) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = "Today";
      container.appendChild(label);
      todayEvents.forEach(ev => container.appendChild(makeCard(ev, today)));
    }

    if (futureEvents.length > 0) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = "Upcoming";
      container.appendChild(label);
      futureEvents.forEach(ev => container.appendChild(makeCard(ev, today)));
    }

  } catch(e) {
    container.innerHTML = `<div class="cal-error">Failed to load calendars: ${e.message}</div>`;
    status.textContent = 'Error';
  }
}

function makeCard(ev, today) {
  const card = document.createElement('div');
  const isToday = formatEventDay(ev, today) === 'TODAY';
  card.className = `event-card${ev.feedType === 'family' ? ' family' : ''}${isToday ? ' today' : ''}`;

  const when = document.createElement('div');
  when.className = `event-when${isToday ? ' today-label' : ''}${isToday && ev.feedType === 'family' ? ' family-label' : ''}`;
  const day  = formatEventDay(ev, today);
  const time = formatEventTime(ev);
  when.textContent = time ? `${day} · ${time}` : day;

  const title = document.createElement('div');
  title.className = 'event-title';
  title.textContent = ev.summary || '(No title)';

  const source = document.createElement('div');
  source.className = 'event-source';
  source.textContent = ev.feedLabel;

  card.appendChild(when);
  card.appendChild(title);
  card.appendChild(source);
  return card;
}

loadCalendars();
// Refresh every 15 minutes
setInterval(loadCalendars, 15 * 60 * 1000);
</script>
</body>
</html>
